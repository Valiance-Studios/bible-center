name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the run in progress. On main, where runs deploy, a newer run waits
# instead, since stopping a deploy partway could leave functions half updated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type-check, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run type-check

      # Builds with the production config, which is public; it is the type and bundle check.
      - run: npm run build

      - run: npm run test:unit

  emulator-tests:
    name: Rules and E2E tests (Firebase emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The Firestore emulator runs on Java.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # The emulator JARs are downloaded on first use; reuse them while firebase-tools is unchanged.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      - run: npm run test:emulator

      - run: npm run test:e2e

      # The report is written next to the Playwright config, which lives in apps/web.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Merging to main releases it: staging first, then production, once every check passes.
  # See "Releasing" in docs/DEPLOYMENT.md.
  deploy-staging:
    name: Deploy to staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, emulator-tests]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      project: vs-bible-center-dev
      project-number: '501647012642'
      service-account: sa-bc-github-deploy-dev

  deploy-production:
    name: Deploy to production
    needs: deploy-staging
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      project: vs-bible-center-prod
      project-number: '571475032694'
      service-account: sa-bc-github-deploy-prod
